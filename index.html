<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Имя на языке роблокс</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: #f7f02c;
      font-family: 'Montserrat', 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }

    .container {
      width: 100%;
      max-width: 800px;
      display: flex;
      flex-direction: column;
      gap: 40px;
    }

    .top-section {
      display: flex;
      gap: 40px;
      align-items: center;
    }

    .image-box {
      width: 300px;
      height: 300px;
      display: flex;
      justify-content: center;
      align-items: center;
      flex-shrink: 0;
    }

    .image-box img {
      width: 100%;
      height: 100%;
      object-fit: contain;
    }

    .title-box {
      flex-grow: 1;
      text-align: left;
    }

    .title-box h1 {
      font-size: 36px;
      font-weight: 800;
      line-height: 1.2;
      color: #000;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    .bottom-section {
      display: flex;
      flex-direction: column;
      gap: 15px;
    }

    .form-row {
      display: flex;
      gap: 20px;
      align-items: center;
    }

    .label-box {
      width: 180px;
      padding: 12px;
      background-color: #fff;
      text-align: center;
      font-weight: bold;
      font-size: 16px;
      flex-shrink: 0;
    }

    .input-group {
      display: flex;
      gap: 10px;
      align-items: center;
      flex-grow: 1;
    }

    .input-field {
      padding: 12px 15px;
      background-color: #fff;
      border: none;
      font-size: 16px;
      outline: none;
    }

    .input-field::placeholder {
      color: #aaa;
    }

    .full-width {
      width: 100%;
      max-width: 450px;
    }

    .medium-width {
      width: 150px;
    }

    .date-input {
      width: 70px;
      text-align: center;
    }

    .separator {
      font-size: 24px;
      font-weight: bold;
    }
  </style>
</head>
<body>

  <div class="container">
    
    <div class="top-section">
      <div class="image-box">
        <img src="фафа (1).png" alt="Персонаж">
      </div>
      <div class="title-box">
        <h1>Твое имя<br>на языке<br>роблокс</h1>
      </div>
    </div>

    <div class="bottom-section">
      
      <div class="form-row">
        <div class="label-box">Номер карты</div>
        <div class="input-group">
          <input 
            type="text" 
            id="card-number" 
            class="input-field full-width" 
            maxlength="19" 
            inputmode="numeric" 
            placeholder="0000 0000 0000 0000">
        </div>
      </div>

      <div class="form-row">
        <div class="label-box">Действительно до</div>
        <div class="input-group">
          <input 
            type="text" 
            class="input-field date-input num-only" 
            maxlength="2" 
            inputmode="numeric" 
            placeholder="ММ">
          <span class="separator">/</span>
          <input 
            type="text" 
            class="input-field date-input num-only" 
            maxlength="2" 
            inputmode="numeric" 
            placeholder="ГГ">
        </div>
      </div>

      <div class="form-row">
        <div class="label-box">Имя держателя карты</div>
        <div class="input-group">
          <input 
            type="text" 
            id="card-holder" 
            class="input-field full-width" 
            maxlength="26" 
            placeholder="IVAN IVANOV">
        </div>
      </div>

      <div class="form-row">
        <div class="label-box">CVV</div>
        <div class="input-group">
          <input 
            type="password" 
            class="input-field medium-width num-only" 
            maxlength="3" 
            inputmode="numeric" 
            placeholder="***">
        </div>
      </div>

    </div>

  </div>

  <script>
    const cardNumberInput = document.getElementById('card-number');
    cardNumberInput.addEventListener('input', (e) => {
      let value = e.target.value.replace(/\D/g, '');
      value = value.substring(0, 16);
      const sections = value.match(/.{1,4}/g);
      e.target.value = sections ? sections.join(' ') : '';
    });

    const numOnlyInputs = document.querySelectorAll('.num-only');
    numOnlyInputs.forEach(input => {
      input.addEventListener('input', (e) => {
        e.target.value = e.target.value.replace(/\D/g, '');
      });
    });

    const cardHolderInput = document.getElementById('card-holder');
    cardHolderInput.addEventListener('input', (e) => {
      e.target.value = e.target.value.replace(/[^a-zA-Z\s]/g, '').toUpperCase();
    });
  </script>

</body>
</html>
